# Shared security headers - included by EVERY location block in nginx.conf.
#
# This exists because nginx's add_header does not accumulate: declaring any
# add_header inside a location discards all of them inherited from the enclosing
# server block. With the headers written only at server level, a response served
# from /assets/, /fonts/ or /index.html - that is, the application document and
# all of its code - went out with no CSP, no X-Frame-Options and no HSTS.
#
# A nonce is not used because the bundle is static; 'unsafe-inline' is limited to
# style-src, which Tailwind and Radix need for inline style attributes. script-src
# stays strict, which is what actually matters.

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=()" always;
# Only meaningful over TLS; harmless on the plain-HTTP staging origin and correct
# the moment the deployment terminates TLS here.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
