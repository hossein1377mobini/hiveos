# HiveOS v0.5 nginx: single origin (SPA + /api proxy).
#
# Two things were missing in v0.1 and both are load-bearing for an on-prem
# install:
#  1. Immutable asset caching. Vite emits content-hashed filenames, so a hashed
#     asset can be cached forever — but index.html must never be, or a deploy
#     leaves every open tab holding a stale document that references deleted
#     chunks and fails with a blank page.
#  2. Security headers. The product renders organisation documents and runs on a
#     machine the operator does not sit in front of; a missing CSP on an admin
#     panel that renders user-supplied filenames is the difference between a
#     stored XSS and an inert one.
#
# NOTE on add_header: nginx does NOT merge headers across levels. A location that
# declares any add_header of its own discards every add_header inherited from the
# server block. Declaring the security headers once at server level therefore
# protected only the routes that had no caching directive — and the two routes
# that matter most (/index.html, the document itself, and /assets/, the code)
# were exactly the ones that had one. The headers now live in an included file
# and every location repeats the include. See deploy/security-headers.conf.

server {
    listen 80;
    server_name _;

    client_max_body_size 50m;

    root /usr/share/nginx/html;
    index index.html;

    # --- security headers ---------------------------------------------------
    # Repeated in every location below; see the note at the top of this file.
    include /etc/nginx/conf.d/security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Content-hashed build output: safe to cache for a year.
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Self-hosted font. Long-lived because the filename is versioned by hand.
    location /fonts/ {
        include /etc/nginx/conf.d/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Canvas reads are a font-fingerprinting vector and nothing here needs it.
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # Brand assets: tiny, stable, and requested on every cold tab open. Cached so
    # a returning visitor does not re-fetch them, but not immutable - the names
    # are not content-hashed, so a rebrand must be able to replace them.
    location ~ ^/(favicon\.svg|apple-touch-icon\.png|site\.webmanifest)$ {
        include /etc/nginx/conf.d/security-headers.conf;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # The document itself is the one file that must always be revalidated.
    location = /index.html {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate";
        expires -1;
    }

    # SPA history fallback (routes like /admin/organizations, /wallet, /chat)
    location / {
        include /etc/nginx/conf.d/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
