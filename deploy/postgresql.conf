# HiveOS launch host: 6 vCPU / 12GB RAM / 75GB disk (2026-09-12).
# PostgreSQL's stock 128MB shared_buffers makes the HNSW vector index read
# from disk on every search. These values hand roughly half of RAM to the
# cache and leave the rest for the OS page cache and the API process.

listen_addresses = '*'
max_connections = 60

# --- memory ---
shared_buffers = 4GB
effective_cache_size = 8GB
work_mem = 32MB
maintenance_work_mem = 512MB

# --- write path ---
wal_buffers = 16MB
checkpoint_completion_target = 0.9
max_wal_size = 2GB
min_wal_size = 512MB

# --- planner (local SSD, plenty of RAM) ---
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 200

# --- parallelism for the vector scans ---
max_worker_processes = 6
max_parallel_workers = 6
max_parallel_workers_per_gather = 2

# --- logging: slow queries and autovacuum, nothing else (disk is precious) ---
log_min_duration_statement = 1000
log_autovacuum_min_duration = 5000
log_line_prefix = '%m [%p] %q%u@%d '
timezone = 'UTC'
