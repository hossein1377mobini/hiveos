# HiveOS v0.1 staging stack (zero-open): PO starts the server, agent uploads,
# PO sets provider keys in the admin panel and tests.
#
#   docker compose -f deploy/docker-compose.staging.yml --env-file deploy/.env up -d --build
#
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: hiveos
      POSTGRES_PASSWORD: ${HIVEOS_PG_PASSWORD:?set HIVEOS_PG_PASSWORD in .env}
      POSTGRES_DB: hiveos
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Hand-tuned for the 6-core / 12GB launch host: the defaults (128MB
      # shared_buffers) leave the vector index thrashing on disk. Half of RAM
      # to the cache, enough parallel workers for the HNSW scans.
      - ./postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hiveos -d hiveos"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      # Settings reads bare env names (no prefix); ENVIRONMENT=staging makes
      # an unset DATABASE_URL fail loudly instead of hitting dev localhost.
      ENVIRONMENT: staging
      DATABASE_URL: postgresql+asyncpg://hiveos:${HIVEOS_PG_PASSWORD}@db:5432/hiveos
      SYSTEM_ADMIN_USERNAME: ${HIVEOS_SYSTEM_ADMIN_USERNAME:-system-admin}
      SYSTEM_ADMIN_PASSWORD: ${HIVEOS_SYSTEM_ADMIN_PASSWORD:?set HIVEOS_SYSTEM_ADMIN_PASSWORD in .env}
      LLM_PROVIDER: ${HIVEOS_LLM_PROVIDER:-mock}
      SMS_PROVIDER: ${HIVEOS_SMS_PROVIDER:-mock}
      # Retrieval runs on this host: the embedded and reranked text of every
      # ingested document stays here and only the answer prompt goes online.
      # Set EMBEDDING_PROVIDER=remote / RERANK_PROVIDER=remote to flip back.
      EMBEDDING_PROVIDER: ${HIVEOS_EMBEDDING_PROVIDER:-onnx}
      EMBEDDING_ONNX_DIR: /opt/models/bge-m3-onnx
      RERANK_ENABLED: ${HIVEOS_RERANK_ENABLED:-true}
      RERANK_PROVIDER: ${HIVEOS_RERANK_PROVIDER:-onnx}
      RERANK_ONNX_DIR: /opt/models/bge-reranker-v2-m3-onnx
      LOCAL_INFERENCE_CONCURRENCY: ${HIVEOS_LOCAL_INFERENCE_CONCURRENCY:-2}
      WALLET_WELCOME_CREDIT: ${HIVEOS_WALLET_WELCOME_CREDIT:-50}
      # NB-1 (final review): nginx is the only hop and the api container is not
      # publicly exposed, so the proxy IP is trusted and X-Forwarded-For supplies
      # the real client for the per-IP rate limiters.
      TRUSTED_PROXIES: ${HIVEOS_TRUSTED_PROXIES:-*}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Read-only int8 ONNX graphs for bge-m3 and bge-reranker-v2-m3. Mounted
      # rather than baked in: they are 1.3GB each and would otherwise be
      # rebuilt into every image layer.
      - /opt/models:/opt/models:ro
      # Read-only view of the backup directory so the admin panel can report
      # whether last night's dump actually ran and how big it was. Without the
      # mount the endpoint could only claim a backup exists, which is exactly
      # the kind of lie an operator discovers during a restore.
      - /opt/hiveos/backups:/backups:ro
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HIVEOS_HTTP_PORT:-80}:80"
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  pgdata:
