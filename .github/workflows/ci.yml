# HiveOS CI (S1-15) — GitHub Actions.
#
# Backend runs under `uv` (see backend/pyproject.toml + uv.lock); the coverage
# floor of 85% is ALSO enforced in pyproject [tool.pytest.ini_options] addopts,
# so the explicit flag below is a belt-and-braces restatement, not new policy.
# Frontend runs under `npm` (see frontend/app/package.json).
#
# ── Branch protection note ─────────────────────────────────────────────────
# Branch protection is a *repository settings* concern and cannot be declared
# here. On GitHub: Settings → Branches → Add rule for `main`, enable
#   • "Require a pull request before merging"
#   • "Require status checks to pass before merging" → Backend, Frontend,
#     Security Scan (the three jobs below)
#   • "Dismiss stale pull request approvals when new commits are pushed".
# This makes `main` merge-only-via-PR with a green CI gate.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (uv · ruff · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # CI service containers run on default ports; config.py reads these env
      # first (pydantic-settings), overriding the localhost:5434/6380 dev
      # defaults baked into app/config.py.
      DATABASE_URL: postgresql+asyncpg://hiveos:hiveos@localhost:5432/hiveos
      REDIS_URL: redis://localhost:6379/0
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: hiveos
          POSTGRES_USER: hiveos
          POSTGRES_PASSWORD: hiveos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hiveos -d hiveos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test (pytest, coverage ≥ 85%)
        run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=85

  frontend:
    name: Frontend (npm ci · tsc · oxlint · vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc -b)
        run: npx tsc -b

      - name: Lint (oxlint)
        run: npm run lint

      - name: Test (vitest run)
        run: npm test

  security:
    name: Secret & dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so gitleaks can scan all commits

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Dependency audit (pip-audit)
        working-directory: backend
        run: |
          uv export --no-dev --no-hashes -o requirements.txt
          uvx pip-audit -r requirements.txt
