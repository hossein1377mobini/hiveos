name: CI and Deploy to Staging

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # manual run on any ref - CI evidence without PR (token lacks pull_requests scope)

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Type-check and build first: a type error is the cheapest failure to read.
      - run: npm run build
      - run: npm run lint
      - run: npm test
      # F4: a11y and bundle budget were previously unenforced, so both could
      # regress without anything failing. The a11y run is the same axe suite as
      # npm test, executed separately so the job log names which gate failed.
      - run: npm run test:a11y
      - run: npm run budget
      # The design-token pass removed 131 bypasses; ungated they drift back one
      # rounded-[12px] at a time. Fails on the first violation, naming file+line.
      - run: npm run audit:ui
      # ui-audit and every class-name grep passed while all elevation rendered
      # box-shadow:none (a circular var() resolves to empty, not an error).
      # This asserts the RESOLVED values in the stylesheet the step above built.
      - run: npm run test:css
      # F3: unit tests run in jsdom, which has no layout, no navigation and no
      # real page - so a whole class of defect (a page with no landmark, a CDN
      # request, a redirect that never fires) was invisible to them.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # G4: pin the nginx security headers to a real server. A config read cannot
  # prove them - add_header does not inherit across levels, and the version of
  # this file that shipped had no CSP on the document itself.
  nginx-headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Serve the config and assert the headers on every route
        run: |
          docker run --rm \
            -v "$PWD/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/deploy/security-headers.conf:/etc/nginx/conf.d/security-headers.conf:ro" \
            -v "$PWD/deploy/check-security-headers.sh:/check.sh:ro" \
            nginx:1.27-alpine sh /check.sh

  deploy-staging:
    needs: backend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f infrastructure/api.Dockerfile -t hiveos/api:ci-$GITHUB_SHA .

      - name: Package image + deploy assets
        run: |
          mkdir -p dist
          docker save hiveos/api:ci-$GITHUB_SHA | gzip > dist/hiveos-api.tgz
          tar -czf dist/hiveos-deploy.tgz \
            -C infrastructure docker-compose.staging.yml \
            -C ../scripts deploy

      - name: Copy artifacts to staging
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ubuntu
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: "dist/*"
          target: /home/ubuntu/deploy
          strip_components: 1

      - name: Deploy on staging (load, compose up, healthcheck)
        uses: appleboy/ssh-action@v1.2.0
        env:
          GIT_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ubuntu
          key: ${{ secrets.STAGING_SSH_KEY }}
          envs: GIT_SHA
          script: |
            set -e
            sudo mkdir -p /opt/hiveos/app
            sudo tar -xzf /home/ubuntu/deploy/hiveos-deploy.tgz -C /opt/hiveos/app
            sudo docker load -i /home/ubuntu/deploy/hiveos-api.tgz
            sudo chmod +x /opt/hiveos/app/deploy/*.sh
            sudo bash /opt/hiveos/app/deploy/remote-deploy.sh "ci-$GIT_SHA"