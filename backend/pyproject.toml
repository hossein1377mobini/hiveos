[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[project]
name = "hiveos-backend"
version = "0.1.0"
description = "HiveOS backend (FastAPI) - v0.1"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.19.2",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0.44",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "pytest>=8.3",
  "ruff>=0.9",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI dependency injection uses calls (Depends(...)) in defaults by design.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
