[project]
name = "hiveos-backend"
version = "0.1.0"
description = "HiveOS v0.1 thin API (ADR-019 Python-first) — Epic-01 Organization Bootstrap"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.29",
    "pgvector>=0.3.6",
    "pydantic>=2.7,<3.0",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "alembic>=1.13",
    "python-multipart>=0.0.9",
    "cryptography>=42.0",
    # WAVE-3B: local embedding pipeline (v0.1 on-prem; no Avalai tokens)
    "fastembed>=0.4",
    "pypdf>=4.0",
    "python-docx>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "asgi-lifespan>=2.1",
    "ruff>=0.5",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
