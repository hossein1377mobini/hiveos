[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[project]
name = "hiveos-backend"
version = "0.1.0"
description = "HiveOS backend (FastAPI) - v0.1"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.19.2",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pgvector>=0.5.0",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.18.0",
    # US-205 image pipeline: classify.py imports this at extraction time. The
    # binary comes from the image (infrastructure/api.Dockerfile); this is only
    # the binding, and without it every image asset fails with
    # ModuleNotFoundError instead of OCR_UNAVAILABLE.
    "pytesseract>=0.3.13",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "python-pptx>=1.0.2",
    "sqlalchemy[asyncio]>=2.0.44",
    "uvicorn[standard]>=0.52.4",
]

# Local inference stack (PO decision 2026-09-12: on-server embeddings and
# reranking, only the answer generator talks to the internet).
#
# 'local-ml' is the ONNX path used in production: onnxruntime + transformers
# feed both bge-m3 and bge-reranker-v2-m3 through their exported int8 graphs.
# It is roughly 1.2GB of image, versus the ~19GB that sentence-transformers
# drags in with torch, and it is faster on the CPU-only host.
[project.optional-dependencies]
local-ml = [
    "onnxruntime>=1.20.1",
    # Pinned below 5: the exported graphs and the tokenizer loading path were
    # validated on the 4.x line, and transformers 5 changes both.
    "transformers>=4.48,<5",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
  # tests/test_onnx_batching.py builds fake (batch, seq_len, hidden) arrays to
  # reproduce a padding bug that reached production as EMBEDDING_UNAVAILABLE.
  # numpy otherwise only arrives with the local-ml extra, which CI does not
  # install, so the test failed to import there. Skipping it would have been
  # wrong: it is the only guard on that padding path.
  "numpy>=2.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI dependency injection uses calls (Depends(...)) in defaults by design.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
