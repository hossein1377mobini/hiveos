openapi: 3.1.0
info:
  title: HiveOS API — Epic-01 (Organization Bootstrap / v0.1)
  version: 0.2.0
  description: >
    قرارداد حداقلی قابل‌کدنویسی (OpenAPI 3.1) برای endpoint های اپیک ۰۱.
    منبع: متن US-001 تا US-008 در `Dropbox/Hive/doc/Development/epic-01/`.
    استک v0.1 (ADR-019): Python-first (thin API) — این قرارداد توافق یکتای
    بک‌اند، فرانت‌اند و QA است. مسیر پایه `/api/v1` مطابق متن استوری‌ها.
  license:
    name: Proprietary
servers:
  - url: http://localhost:8100
    description: Dev server (v0.1 Python thin API)
security:
  - sessionCookie: []

paths:
  /api/v1/organizations:
    post:
      summary: ثبت سازمان جدید (US-001)
      description: >
        یک Organization + Workspace مستقل + Tenant ID یکتا می‌سازد و سازمان را در وضعیت
        `pending_owner_registration` قرار می‌دهد. عملیات تراکنشی است.
        ادغام US-006 در US-001 (decision 2026-08-19): توصیف کسب‌وکار و پیکربندی مدل AI
        در همین درخواست ارسال می‌شوند؛ توصیف کسب‌وکار به‌عنوان اولین سند به Brain تزریق می‌شود.
      security: []
      operationId: createOrganization
      tags: [Onboarding]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationCreate' }
      responses:
        '201':
          description: ساخته شد — هدایت به US-002
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/users/owner:
    post:
      summary: ایجاد حساب Owner/Admin (US-002)
      description: >
        اولین و تنها حساب ادمین را برای سازمانِ محدوده‌شده با سشنِ جاریِ Pending
        می‌سازد، نقش Owner اختصاص می‌دهد و سشن اولیه صادر می‌کند. موبایل شناسهٔ
        یکتای ورود در کل سیستم است.
      operationId: createOwner
      tags: [Onboarding]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OwnerCreate' }
      responses:
        '201':
          description: Owner ساخته شد و سشن صادر شد — هدایت به US-003
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/v1/auth/send-otp:
    post:
      summary: ارسال کد OTP (US-003)
      description: >
        یک کد یک‌بارمصرف ۶ رقمی با اعتبار قابل‌تنظیم (پیش‌فرض ۲ دقیقه) برای شمارهٔ موبایل
        ارسال می‌کند. سرور برای ارسال SMS باید در لحظه به اینترنت دسترسی داشته باشد؛
        در نبود دسترسی، خطای صریح برمی‌گردد (نه شکست خاموش).
      operationId: sendOtp
      tags: [Onboarding]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpSendRequest' }
      responses:
        '200':
          description: ارسال شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpSendResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: مالک در وضعیت pending یافت نشد — شماره برای ارسال OTP معتبر نیست
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503':
          description: دسترسی به SMS Gateway/اینترنت در دسترس نیست (FR-007)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/resend-otp:
    post:
      summary: ارسال مجدد OTP (US-003)
      description: در صورت انقضا/نقص، ارسال مجدد را ممکن می‌کند (مطابق سیاست امنیتی/نرخ).
      operationId: resendOtp
      tags: [Onboarding]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpSendRequest' }
      responses:
        '200':
          description: ارسال مجدد شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpSendResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: مالک در وضعیت pending یافت نشد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/GatewayUnavailable' }

  /api/v1/auth/verify-otp:
    post:
      summary: اعتبارسنجی OTP و فعال‌سازی (US-003)
      description: >
        کد صحیح → User/Organization فعال می‌شوند و OTP بلافاصله باطل می‌شود.
        کد اشتباه → تلاش ثبت می‌شود؛ پس از ۵ تلاش ناموفق، درخواست موقتاً مسدود می‌شود.
      operationId: verifyOtp
      tags: [Onboarding]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpVerifyRequest' }
      responses:
        '200':
          description: تأیید موفق — فعال‌سازی و هدایت به US-004
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpVerifyResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: مالک (pending) برای این شماره یافت نشد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '410':
          description: OTP منقضی‌شده
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/workspaces/initialize:
    post:
      summary: راه‌اندازی Workspace سازمان (US-004)
      description: >
        Workspace سازمانِ سشن جاری را که در US-001 ساخته شده است راه‌اندازی
        می‌کند: تنظیمات پیش‌فرض را از اطلاعات US-001 به‌ارث می‌برد
        (زبان/منطقه زمانی/لوکال) و وضعیت آن را از `pending` به `ready` می‌برد.
        دقیقاً یک Workspace به‌ازای هر سازمان وجود دارد (محدودیت یکتای
        organization_id در DB اجباری است) — این عملیات هرگز Workspace دوم
        نمی‌سازد.
      operationId: initializeWorkspace
      tags: [Onboarding]
      responses:
        '201':
          description: Workspace آماده است
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceInitialized' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: تعارض (سازمان فعال نیست / Workspace آماده نیست / وضعیت ناسازگار)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: راه‌اندازی ناموفق (audit-logged) — retry مجاز
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/brain/initialize:
    post:
      summary: راه‌اندازی Organization Brain (پایه v0.1) (US-005)
      description: >
        زیرساخت RAG پایه v0.1 می‌سازد: Knowledge Repository خالی + Vector Index.
        تنظیمات Embedding Provider/Retrieval/Default Language را مقداردهی می‌کند
        (Embedding Provider از پیکربندی AI مدلِ US-001 خوانده می‌شود، که در US-006 ادغام شده).
      operationId: initializeBrain
      tags: [Onboarding]
      responses:
        '201':
          description: Brain آماده است
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrainInitialized' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: تعارض (سازمان فعال نیست / Workspace آماده نیست / وضعیت ناسازگار)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: راه‌اندازی ناموفق — retry مجاز
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/ingestion-folder/configure:
    post:
      summary: پیکربندی فولدر Ingestion (US-007)
      description: >
        مسیر فولدر (روی سرور on-premise) را می‌گیرد، دسترسی خواندن را اعتبارسنجی می‌کند و
        سرویس پایش مداوم آن را فعال می‌کند. در نبود پیکربندی معتبر AI model، فعال‌سازی مسدود است.
      operationId: configureIngestionFolder
      tags: [Ingestion]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IngestionFolderConfigure' }
      responses:
        '201':
          description: پایش فعال شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestionFolderStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403':
          description: بدون دسترسی خواندن / مسیر خارج از محدودهٔ مجاز
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: پیکربندی AI model ناقص/نامعتبر است (FR-010)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/ingestion-folder/status:
    get:
      summary: وضعیت فولدر و پردازش (US-007)
      operationId: getIngestionFolderStatus
      tags: [Ingestion]
      responses:
        '200':
          description: وضعیت پایش و شمارنده‌های اسناد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestionFolderStatus' }
        '404':
          description: فولدر پیکربندی نشده است
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/documents:
    get:
      summary: فهرست صفحه‌بندی‌شدهٔ اسناد (US-007 / S1-18)
      description: >-
        فهرست اسناد شناسایی‌شده با وضعیت پردازش — برای نمایش زنده به Owner.
        پاسخ در پاکت `{items, meta}` برمی‌گردد؛ `meta.total` اندازهٔ کامل
        مجموعهٔ نتیجه پیش از صفحه‌بندی است. sort فقط فیلدهای مجاز را می‌پذیرد.
      operationId: listDocuments
      tags: [Ingestion]
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
          description: شمارهٔ صفحه (یک‌مبنا)
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
          description: تعداد آیتم در هر صفحه
        - name: sort
          in: query
          required: false
          schema:
            type: string
            default: '-createdAt'
            enum: [createdAt, -createdAt, filename, -filename, sizeBytes, -sizeBytes, status, -status, format, -format]
          description: کلید مرتب‌سازی؛ پیشوند `-` یعنی نزولی. مقدار نامعتبر به `-createdAt` می‌افتد.
        - name: filter
          in: query
          required: false
          schema: { type: string }
          description: جستجوی زیررشته‌ای (غیرحساس به بزرگی) در نام فایل
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [detected, processing, ready, failed]
          description: فیلتر بر اساس وضعیت سند
      responses:
        '200':
          description: فهرست صفحه‌بندی‌شدهٔ اسناد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentPage' }

  /api/v1/documents/{id}/status:
    get:
      summary: وضعیت یک سند (US-007)
      operationId: getDocumentStatus
      tags: [Ingestion]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: شناسهٔ زمان‌حقیقی (پیشنهادی UUID) سند
      responses:
        '200':
          description: وضعیت
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentStatusResponse' }
        '404':
          description: سند یافت نشد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/onboarding/status:
    get:
      summary: وضعیت Onboarding (US-008)
      operationId: getOnboardingStatus
      tags: [Onboarding]
      responses:
        '200':
          description: وضعیت تکمیل Bootstrap و آمادگی مستند
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnboardingStatus' }

  /api/v1/onboarding/complete:
    post:
      summary: تکمیل Onboarding و ورود به چت (US-008)
      description: >
        شرط: تمام مراحل US-001..US-005 تکمیل و پایش فولدر (US-007) فعال باشد. در موفقیت،
        وضعیت onboarding = completed و کاربر به نقطهٔ ورود چت (EPIC-09) دستیابی پیدا می‌کند.
      operationId: completeOnboarding
      tags: [Onboarding]
      responses:
        '200':
          description: Onboarding تکمیل شد — handoff به Hive Mind chat
          content:
            application/json:
              schema:
                type: object
                properties:
                  onboardingStatus: { type: string, const: completed }
                  next:
                    type: string
                    enum: [hive-mind-chat]
                required: [onboardingStatus, next]
        '409':
          description: Bootstrap ناقص است — مراحل ازقلم‌افتاده برگردانده می‌شود
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnboardingIncomplete' }

  /api/v1/healthz:
    get:
      summary: سلامت سرویس (Operations)
      description: >
        Endpoint سلامت بدون نیاز به احراز هویت؛ برای پایش آمادگی سرویس (ready/liveness)
        و تست اتصال dev استفاده می‌شود. خارج از USهای Epic-01 است و در `README.md`
        (Getting Started) نیز ارجاع شده است. فقط `{"status": "ok"}` برمی‌گرداند.
      security: []
      operationId: healthz
      tags: [Operations]
      responses:
        '200':
          description: سرویس در دسترس است
          content:
            application/json:
              schema:
                type: object
                required: [status]
                additionalProperties: false
                properties:
                  status: { type: string, const: ok }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: >
        سشن Secure/HttpOnly که پس از US-002 صادر و در US-003 تأیید می‌شود؛
        محدودهٔ Organization را برای درخواست‌های Owner مشخص می‌کند.

  responses:
    BadRequest:
      description: ورودی نامعتبر
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: سشن معتبر نیست
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: دسترسی مجاز نیست
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: یافت نشد
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: تعارض (تکراری/وضعیت ناسازگار)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unprocessable:
      description: شکست قوانین اعتبارسنجی (مثلاً رمز عبور ضعیف)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationProblem' }
    RateLimited:
      description: محدودیت نرخ
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    GatewayUnavailable:
      description: سرویس خارجی (SMS Gateway/اینترنت) در دسترس نیست
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    OrganizationCreate:
      type: object
      additionalProperties: false
      required: [displayName, industry, companySize, businessDescription, aiModel]
      properties:
        displayName:
          type: string
          description: نام رسمی سازمان. ۳ تا ۱۰۰ کاراکتر، Unicode.
          minLength: 3
          maxLength: 100
        industry:
          type: string
          description: صنعت سازمان. الزامی.
        companySize:
          type: string
          description: مقیاس تعداد نفر. الزامی.
          enum: [lt_10, 10_to_49, 50_to_199, 200_to_499, ge_500]
        businessDescription:
          $ref: '#/components/schemas/BusinessDescription'
        aiModel:
          $ref: '#/components/schemas/AIModelConfiguration'
      description: >
        ادغام US-001 + US-006 (decision 2026-08-19): توصیف کسب‌وکار و پیکربندی مدل AI در همین
        درخواست ایجاد سازمان ارسال می‌شوند. country/timeZone/language در ورودی حذف شدند و مقادیر
        پیش‌فرض (fa-IR / Iran / Asia-Tehran) از سمت سرور اعمال می‌شوند. slug حذف شد.

    Organization:
      type: object
      required: [id, name, status]
      properties:
        id:
          type: string
          format: uuid
        name: { type: string }
        status:
          type: string
          enum: [pending_owner_registration, active]
        tenantId: { type: string }
        workspaceId:
          type: [string, 'null']
          format: uuid
        createdAt: { type: string, format: date-time }

    OwnerCreate:
      type: object
      additionalProperties: false
      required: [phone, password, confirmPassword]
      properties:
        phone:
          type: string
          description: شناسهٔ اصلی ورود؛ پیشوند +98 ثابت + ۱۰ رقم (شماره موبایل ایران).
          pattern: '^\+98\d{10}$'
        email:
          type: [string, 'null']
          format: email
          description: اختیاری؛ یکتا در کل سیستم، case-insensitive.
        password:
          type: string
          description: حداقل ۸ کاراکتر شامل حرف بزرگ، کوچک، عدد و نماد لاتین.
          minLength: 8
          pattern: '^(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[!@#$%^&*()_+\-=\[\]{};:''"\\|,.<>\/?~`]).{8,}$'
        confirmPassword:
          type: string
          description: باید دقیقاً با password برابر باشد.

    OwnerCreated:
      type: object
      required: [userId, organizationId, status, sessionIssued]
      properties:
        userId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        status: { type: string, const: pending }
        sessionIssued: { type: boolean }

    OtpSendRequest:
      type: object
      additionalProperties: false
      required: [phone]
      properties:
        phone:
          type: string
          description: شماره موبایل ایران؛ پیشوند ثابت +98 و دقیقاً ۱۰ رقم.
          pattern: '^\+98\d{10}$'

    OtpSendResponse:
      type: object
      required: [status, resendAfterSeconds, expiresInSeconds]
      properties:
        status: { type: string, const: sent }
        resendAfterSeconds: { type: integer, minimum: 0 }
        expiresInSeconds: { type: integer, example: 120 }

    OtpVerifyRequest:
      type: object
      additionalProperties: false
      required: [phone, code]
      properties:
        phone:
          type: string
          description: شماره موبایل ایران؛ پیشوند ثابت +98 و دقیقاً ۱۰ رقم.
          pattern: '^\+98\d{10}$'
        code:
          type: string
          description: کد ۶ رقمی یک‌بارمصرف.
          pattern: '^\d{6}$'

    OtpVerifyResponse:
      type: object
      required: [verified, userStatus, organizationStatus]
      properties:
        verified: { type: boolean, const: true }
        userStatus: { type: string, enum: [active] }
        organizationStatus: { type: string, enum: [active] }

    WorkspaceInitialized:
      type: object
      required: [workspaceId, status]
      properties:
        workspaceId: { type: string, format: uuid }
        status: { type: string, enum: [ready, failed] }
        settings:
          $ref: '#/components/schemas/WorkspaceSettings'

    WorkspaceSettings:
      type: object
      properties:
        language: { type: string }
        timeZone: { type: string }
        dateFormat: { type: string }
        numberFormat: { type: string }
        defaultLocale: { type: string }

    BrainInitialized:
      type: object
      required: [brainId, knowledgeRepositoryId, vectorIndexId, status]
      properties:
        brainId: { type: string, format: uuid }
        knowledgeRepositoryId: { type: string, format: uuid }
        vectorIndexId: { type: string, format: uuid }
        status: { type: string, enum: [ready, failed] }
        rag:
          type: object
          properties:
            embeddingProvider: { type: string }
            defaultLanguage: { type: string }

    BusinessDescription:
      type: object
      required: [whatYouDo, productsServices]
      properties:
        whatYouDo:
          type: string
          description: کسب‌وکار سازمان دقیقاً چه می‌کند (۱-۲ جمله). فاصله‌های ابتدا/انتهای حذف و سپس حداقل طول سنجیده می‌شود.
          minLength: 10
        productsServices:
          type: string
          description: مهم‌ترین محصولات/خدمات سازمان. فاصله‌های ابتدا/انتهای حذف و سپس حداقل طول سنجیده می‌شود.
          minLength: 10

    AIModelConfiguration:
      type: object
      required: [mode, provider, apiKey]
      description: >
        پیکربندی مدل AI سازمان (v0.1). ⚠️ DRIFT با ADR-020 (accepted): BYOK حذف شده و
        کاربر دیگر apiKey نمی‌آورد (دسترسی مدیریت‌شدهٔ HiveOS + کیف پول اعتباری). apiKey
        تا مهاجرت کد (روتر/metering/billing) در backend حفظ شده تا قرارداد با پیاده‌سازی
        فعلی یکدست بماند. حذف آن یک change کد + تصمیم CEO/PO است (خارج از اسکوپ docs) —
        رکورد تصمیم: `docs/decisions/2026-08-20-docs-contract-alignment.md`.
      properties:
        mode:
          type: string
          enum: [online]
          description: در v0.1 فقط online؛ local برای نسخه‌های بعدی رزرو شده.
        provider:
          type: string
          description: از فهرست ارائه‌دهندگان پشتیبانی‌شده.
        apiKey:
          type: string
          writeOnly: true
          description: ذخیرهٔ رمزنگاری‌شده؛ هرگز در لاگ‌/Audit ثبت نمی‌شود.

    IngestionFolderConfigure:
      type: object
      additionalProperties: false
      required: [folderPath]
      properties:
        folderPath:
          type: string
          description: مسیر فولدر روی سرور؛ باید درمحدودهٔ مجاز و قابل‌خواندن باشد.

    IngestionFolderStatus:
      type: object
      required: [active]
      properties:
        active: { type: boolean }
        folderPath: { type: [string, 'null'] }
        watchStartedAt: { type: [string, 'null'], format: date-time }
        counts:
          type: object
          properties:
            detected: { type: integer }
            processing: { type: integer }
            ready: { type: integer }
            failed: { type: integer }

    Document:
      type: object
      required: [id, filename, format, status]
      properties:
        id: { type: string }
        filename: { type: string }
        format:
          type: string
          enum: [pdf, docx, txt, md]
        sizeBytes: { type: integer }
        status:
          type: string
          enum: [detected, processing, ready, failed]
        error:
          type: [string, 'null']
          description: در صورت failed دلیل شفاف.
        createdAt: { type: string, format: date-time }

    DocumentStatusResponse:
      type: object
      required: [id, status]
      properties:
        id: { type: string }
        status:
          type: string
          enum: [detected, processing, ready, failed]
        error: { type: [string, 'null'] }

    PageMeta:
      type: object
      required: [total, page, pageSize, totalPages]
      properties:
        total:
          type: integer
          description: اندازهٔ کامل مجموعهٔ نتیجه پیش از صفحه‌بندی
        page: { type: integer }
        pageSize: { type: integer }
        totalPages:
          type: integer
          description: 'ceil(total / pageSize)'

    DocumentPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Document' }
        meta: { $ref: '#/components/schemas/PageMeta' }
      description: پاکت صفحه‌بندی‌شدهٔ فهرست اسناد (S1-18)

    OnboardingStatus:
      type: object
      required: [onboardingStatus]
      properties:
        onboardingStatus:
          type: string
          enum: [pending, in_progress, completed]
        missingSteps:
          type: array
          items:
            type: string
            enum: [register-organization, owner-account, verify-owner, workspace, brain, ingestion-folder]
      description: missingSteps در صورت in_progress پر می‌شود.

    OnboardingIncomplete:
      type: object
      required: [onboardingStatus, missingSteps]
      properties:
        onboardingStatus: { type: string, const: in_progress }
        missingSteps:
          type: array
          items: { type: string }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: کد/پیام خطای کوتاه.
        message:
          type: string
          description: پیام قابل‌فهم برای کاربر.
        auditLogged:
          type: boolean
        resendAfterSeconds:
          type: integer
          minimum: 0
          description: زمان باقی‌ماندهٔ توقف پیش از ارسال مجدد OTP (فقط در پاسخ 429).

    ValidationProblem:
      type: object
      required: [title, status, errors]
      properties:
        title: { type: string, const: Validation failed }
        status: { type: integer, const: 422 }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
