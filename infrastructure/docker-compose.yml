# HiveOS v0.1 - base compose (dev). Prod overlay: docker-compose.prod.yml (T-S0-3/T-S0-4).
# ADR-019: vector store = pgvector on Postgres 16 (Qdrant deferred to v0.2).
# App DB published on host port 5434 by default (5432 = native postgres on dev machine,
# 5433 = kaneo; see T-S0-3 report). Override with POSTGRES_HOST_PORT.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: hiveos-db
    environment:
      POSTGRES_USER: hiveos
      POSTGRES_PASSWORD: hiveos
      POSTGRES_DB: hiveos
    ports:
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hiveos -d hiveos"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: infrastructure/api.Dockerfile
    container_name: hiveos-api
    environment:
      ENVIRONMENT: dev
      DATABASE_URL: postgresql+asyncpg://hiveos:hiveos@db:5432/hiveos
    ports:
      - "8100:8100"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
