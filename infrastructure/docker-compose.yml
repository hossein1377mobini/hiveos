# HiveOS v0.1 Docker infrastructure (ADR-019 Python-first backend).
#
# SEPARATE from the Kaneo sample stack:
#   - Postgres runs on host port 5434 (Kaneo uses 5433, container kaneo-postgres-1).
#   - Redis runs on host port 6380 (avoids a possibly-busy host 6379).
# These are independent instances; nothing here touches the running containers.

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: hiveos-db
    environment:
      POSTGRES_DB: hiveos
      POSTGRES_USER: hiveos
      POSTGRES_PASSWORD: hiveos
    ports:
      - "5434:5432"
    volumes:
      - hiveos-db-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hiveos -d hiveos"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: hiveos-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # S1-16: backup/recovery sidecar (ADR-006). Reuses the pg16 image so the
  # pg_dump/pg_restore version always matches the server. Runs backup.sh on a
  # loop (BACKUP_INTERVAL_SECONDS, default nightly) into the hiveos-backups
  # volume (host-mounted ./backups). See infrastructure/backup/README.md.
  pgbackup:
    image: pgvector/pgvector:pg16
    container_name: hiveos-pgbackup
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: hiveos
      PGDATABASE: hiveos
      PGPASSWORD: hiveos
      BACKUP_DIR: /var/backups/hiveos
      BACKUP_INTERVAL_SECONDS: "${BACKUP_INTERVAL_SECONDS:-86400}"
    volumes:
      - hiveos-backups:/var/backups/hiveos
      - ./backup:/backup:ro
    entrypoint: ["/bin/bash", "/backup/backup-loop.sh"]
    restart: unless-stopped

volumes:
  hiveos-db-data:
  hiveos-backups:
