# HiveOS v0.1 - prod overlay. Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Runs on staging/prod hosts (see operations/infrastructure-staging-prod.md).
services:
  api:
    environment:
      ENVIRONMENT: prod
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: hiveos-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped
