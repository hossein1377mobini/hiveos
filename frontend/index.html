<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Light mode only (PO decision): the app declares its colour scheme so the
         browser does not apply a dark form-control or scrollbar treatment to a
         product that is light-only. -->
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="HiveOS — فضای کار هوش سازمانی؛ گفتگو با اسناد سازمان، پایش مصرف و مدیریت اشتراک."
    />
    <!-- The font is self-hosted: an air-gapped on-prem install has no route to a
         CDN, so the browser must be told before the CSS loads which files exist.
         Without this the first paint uses the Tahoma fallback and reflows. -->
    <link
      rel="preload"
      href="/fonts/IRANYekanXFaNumVF.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- iOS ignores SVG favicons and falls back to a screenshot of the page, so
         the same hexagon is shipped as a raster as well. Generated by
         scripts/make-apple-touch-icon.mjs - no image toolchain needed. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="HiveOS — فضای کار هوش سازمانی" />
    <meta
      property="og:description"
      content="گفتگو با اسناد سازمان، پایش مصرف و مدیریت اشتراک."
    />
    <meta property="og:locale" content="fa_IR" />
    <title>HiveOS — فضای کار</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 24px; font-family: Tahoma, sans-serif; direction: rtl">
        برای استفاده از HiveOS باید جاوااسکریپت مرورگر فعال باشد.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
